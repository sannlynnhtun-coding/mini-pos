<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <title>Blazor WASM - Mini-POS</title>
    <base href="/" />

    <script>
        (function () {
            try {
                var stored = localStorage.getItem("minipos-theme");
                var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
                var useDark = stored ? stored === "dark" : prefersDark;
                document.documentElement.classList.toggle("dark", useDark);
            } catch {
                // ignore
            }
        })();
    </script>

    <!-- favicon: orange shopping bag SVG -->

        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ea580c' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z'/%3E%3Cline x1='3' y1='6' x2='21' y2='6'/%3E%3Cpath d='M16 10a4 4 0 01-8 0'/%3E%3C/svg%3E" />

    <style>
        :root {
            --primary-orange: #f97316;
            --primary-orange-light: #fb923c;
            --primary-orange-dark: #ea580c;
        }

        .loading-shell {
            height: 100vh;
            display: flex;
            background: #f8fafc; /* match main app body */
            color: #0f172a;
            font-family: 'Outfit', sans-serif;
        }

        .loading-sidebar {
            width: 18rem; /* matches `w-72` sidebar */
            background: #ffffff;
            border-right: 1px solid rgba(226, 232, 240, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .loading-sidebar-badge {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            box-shadow: 0 10px 20px -5px rgba(234, 88, 12, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
        }

        .loading-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            padding: 2rem;
        }

        .loading-svg {
            width: 80px;
            height: 80px;
        }

        .loading-text {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            background: linear-gradient(90deg, #f97316, #fb923c, #f97316);
            background-size: 200% auto;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 2s linear infinite;
        }

        .loading-subtext {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: rgba(100, 116, 139, 0.95);
        }

        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }

        /* Premium Animations */
        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .animate-scale-in {
            animation: scaleIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .animate-slide-up {
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .animate-fade-in {
            animation: fadeIn 0.6s ease-out;
        }

        .premium-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            border: 1px solid #e2e8f0;
            outline: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
        }

        .premium-input:focus {
            box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.15);
            border-color: #f97316;
            background-color: white;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.04), 0 4px 10px -4px rgba(0, 0, 0, 0.02);
            border-radius: 1.25rem;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.08);
        }

        .orange-gradient {
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
        }

        .orange-gradient-soft {
            background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%);
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="loading-shell">
            <aside class="loading-sidebar" aria-hidden="true">
                <div class="loading-sidebar-badge">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z" />
                        <line x1="3" y1="6" x2="21" y2="6" />
                        <path d="M16 10a4 4 0 01-8 0" />
                    </svg>
                </div>
            </aside>
            <main class="loading-main">
                <svg class="loading-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <circle cx="50" cy="50" r="45" stroke="#e2e8f0" stroke-width="8" />
                    <circle cx="50" cy="50" r="45" stroke="#f97316" stroke-width="8" stroke-linecap="round"
                        stroke-dasharray="283" stroke-dashoffset="210">
                        <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="1s"
                            repeatCount="indefinite" />
                    </circle>
                </svg>
                <div class="loading-text">MiniPOS Loading</div>
                <div class="loading-subtext">Preparing workspace</div>
            </main>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="js/custom.js?v=reports-1"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
</body>

</html>
