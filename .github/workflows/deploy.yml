name: Deploy to Vercel

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: BlazorWasm.MiniPOS/package-lock.json

    - name: Install JS dependencies
      working-directory: BlazorWasm.MiniPOS
      run: npm ci

    - name: Run Build Scripts
      working-directory: BlazorWasm.MiniPOS
      run: npm run build

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    - name: Publish WasmApp
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      run: dotnet publish BlazorWasm.MiniPOS/BlazorWasm.MiniPOS.csproj -c Release -o release

    - name: Copy vercel.json to publish output
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      run: cp vercel.json release/wwwroot/

    - name: Deploy to Vercel
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      working-directory: ./release/wwwroot
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      run: npx --yes vercel@latest --prod --yes --token="$VERCEL_TOKEN"
